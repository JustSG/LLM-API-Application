<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistral AI Chat</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <div id="sidebar">
        <div id="options">
            <div class="option">New chat</div>
        </div>
        <hr>
        <div id="tools">
            <div class="tool">
                <img src="img/chat.svg">
                <p>Chat</p>
            </div>
            <div class="tool">
                <img src="img/summary.svg">
                <p>Text summary</p>
            </div>
            <div class="tool">
                <img src="img/game.svg">
                <p>Text RPG game</p>
            </div>
        </div>
    </div>
    <main>
        <div id="content">
            <header>
                <h2>Mistral AI Assistant</h2>
            </header>
            <div id="chat-window" class="chat-window">
                <!-- Tutaj będą pojawiać się wiadomości -->
            </div>
            <form id="chat-form" class="chat-form">
                <input type="text" id="user-input" placeholder="Napisz wiadomość..." required autocomplete="off">
                <button type="submit">Wyślij</button>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
