<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mistral AI Chat</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages/summary.css">
</head>

<body>
  <div id="sidebar">
    <div id="options">
      <div class="option">New chat</div>
    </div>
    <hr>
    <div id="tools">
      <a href="/">
        <div class="tool">
          <img src="img/chat.svg">
          <p>Chat</p>
        </div>
      </a>
      <a href="summary">
        <div class="tool">
          <img src="img/summary.svg">
          <p>Text summary</p>
        </div>
      </a>
      <a href="text-game">
        <div class="tool">
          <img src="img/game.svg">
          <p>Text RPG game</p>
        </div>
      </a>
    </div>
  </div>
  <main>
    <div id="content">
      <header>
        <h2>Text summary</h2>
      </header>
      <div id="chat-window" class="chat-window">
        <!-- Tutaj będą pojawiać się wiadomości -->
      </div>
      <form id="chat-form">
        <textarea type="text" id="user-input" placeholder="Paste here text to summarize..." required></textarea>
        <button type="submit">Wyślij</button>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="js/summary.js"></script>
</body>

</html>
