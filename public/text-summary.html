<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mistral AI Chat</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages/summary.css">
</head>

<body>

  <aside class="sidebar" id="sidebar">
    <button class="toggle-btn" id="sidebar-toggle" aria-label="Zwiń/rozwiń panel">
      <svg class="icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <svg class="icon-burger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round" />
      </svg>
    </button>

    <div class="sidebar-content">
      <button class="new-chat-btn">New chat</button>

      <nav class="tool-list">
        <a href="/" class="tool-item">
          <img src="assets/img/chat.svg" class="tool-icon">
          <span class="tool-label">Chat</span>
        </a>
        <a href="/text-summary" class="tool-item">
          <img src="assets/img/summary.svg" class="tool-icon">
          <span class="tool-label">Text summary</span>
        </a>
        <a href="/language-learning" class="tool-item">
          <img src="assets/img/lang.svg" class="tool-icon">
          <span class="tool-label">Language learning</span>
        </a>
        <a href="/rpg-game" class="tool-item">
          <img src="assets/img/game.svg" class="tool-icon">
          <span class="tool-label">RPG text game</span>
        </a>
      </nav>
    </div>
  </aside>

  <main>
    <div id="content">
      <header>
        <h2>Text summary</h2>
      </header>
      <div id="chat-window" class="chat-window">
        <!-- Tutaj będą pojawiać się wiadomości -->
      </div>
      <form id="chat-form">
        <textarea type="text" id="user-input" placeholder="Paste here text to summarize..." required></textarea>
        <button type="submit">Wyślij</button>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/text-summary.js"></script>
</body>

</html>
